@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop2 {
  from {
    opacity: 0;
    transform: rotate(-70deg) scale(0.6);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes glow {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 6px 1px rgb(10 132 255 / 0.7), 0 0 0 0 rgb(10 132 255 / 0.5);
  }
  50% {
    transform: scale(1.25);
    box-shadow: 0 0 14px 4px rgb(10 132 255 / 0.85), 0 0 0 7px rgb(10 132 255 / 0);
  }
}
@keyframes ring {
  from {
    transform: scale(0.8);
    opacity: 0.9;
  }
  to {
    transform: scale(1.7);
    opacity: 0;
  }
}
@keyframes pop3 {
  from {
    transform: scale(0.4);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes draw {
  from {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  to {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
  }
}
@keyframes float {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  33% {
    transform: translate3d(28px, 18px, 0) scale(1.12);
  }
  66% {
    transform: translate3d(-20px, 30px, 0) scale(0.94);
  }
}
@keyframes letter {
  from {
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: none;
  }
}
@keyframes bar {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}
@keyframes scan {
  0%, 100% {
    top: 0;
  }
  50% {
    top: calc(100% - 3px);
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes sheet {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}
@keyframes toast {
  from {
    opacity: 0;
    transform: translateY(-12px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes shimmer {

  }

A\u0440\u0438\u043D\u0448\u043E\u0442 \u0441\u043E\u0441\u0442\u0430\u0432\u0430. \u0417\u0430\u043A\u0430\u0437 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0417\u0430\u043A\u0430\u0437\u044B\xBB, \u0430 \u043A\u043E\u0433\u0434\u0430 \u043E\u0446\u0435\u043D\u043A\u0430 \u0431\u0443\u0434\u0435\u0442 \u0433\u043E\u0442\u043E\u0432\u0430, \u0431\u043E\u0442 \u043F\u0440\u0438\u0448\u043B\u0451\u0442 \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u0435 \u0432 Telegram.":"Open the Submit tab, enter your nickname and UID, and upload a screenshot of your squad. The order will appear in the Orders tab, and when the rating is ready the bot will send you a notification in Telegram.","\u041A\u0430\u043A\u043E\u0439 \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442 \u043F\u043E\u0434\u043E\u0439\u0434\u0451\u0442?":"What kind of screenshot works?","\u0427\u0451\u0442\u043A\u0438\u0439 \u0441\u043D\u0438\u043C\u043E\u043A \u0432\u0441\u0435\u0433\u043E \u0441\u0442\u0430\u0440\u0442\u043E\u0432\u043E\u0433\u043E \u0441\u043E\u0441\u0442\u0430\u0432\u0430 \u0432 \u0444\u043E\u0440\u043C\u0430\u0442\u0435 JPG, PNG \u0438\u043B\u0438 WEBP. \u0412\u0441\u0435 \u0438\u0433\u0440\u043E\u043A\u0438 \u0438 \u0438\u0445 \u0440\u0435\u0439\u0442\u0438\u043D\u0433\u0438 \u0434\u043E\u043B\u0436\u043D\u044B \u0445\u043E\u0440\u043E\u0448\u043E \u0447\u0438\u0442\u0430\u0442\u044C\u0441\u044F, \u0431\u0435\u0437 \u043E\u0431\u0440\u0435\u0437\u0430\u043D\u043D\u044B\u0445 \u043A\u0440\u0430\u0451\u0432.":"A clear shot of your entire starting lineup in JPG, PNG or WEBP format. All players and their ratings must be easy to read, with no cropped edges.","\u041F\u043E\u0447\u0435\u043C\u0443 \u043C\u043E\u0439 \u0437\u0430\u043A\u0430\u0437 \u043E\u0442\u043A\u043B\u043E\u043D\u0438\u043B\u0438?":"Why was my order rejected?","\u041E\u0431\u044B\u0447\u043D\u043E \u043F\u0440\u0438\u0447\u0438\u043D\u0430 \u0432 \u043D\u0435\u0447\u0438\u0442\u0430\u0435\u043C\u043E\u043C \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442\u0435 \u0438\u043B\u0438 \u043D\u0435\u0432\u0435\u0440\u043D\u043E\u043C UID. \u041E\u0442\u043F\u0440\u0430\u0432\u044C\u0442\u0435 \u043D\u043E\u0432\u044B\u0439 \u0437\u0430\u043A\u0430\u0437 \u0441 \u0431\u043E\u043B\u0435\u0435 \u0447\u0451\u0442\u043A\u0438\u043C \u0441\u043D\u0438\u043C\u043A\u043E\u043C. \u0415\u0441\u043B\u0438 \u0441\u043E\u043C\u043D\u0435\u0432\u0430\u0435\u0442\u0435\u0441\u044C, \u043D\u0430\u043F\u0438\u0448\u0438\u0442\u0435 \u0432 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443.":"Usually it is because of an unreadable screenshot or a wrong UID. Submit a new order with a clearer image. If you are unsure, contact support.","\u041F\u043E\u043F\u0430\u0434\u0443 \u043B\u0438 \u044F \u0432 \u0432\u0438\u0434\u0435\u043E \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u043E?":"Can I get into a video for free?","\u0411\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u0430\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0430 \u043D\u0435 \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u0443\u0435\u0442 \u043F\u043E\u044F\u0432\u043B\u0435\u043D\u0438\u0435 \u0432 \u0432\u0438\u0434\u0435\u043E. \u041C\u044B \u0440\u0430\u0437\u0431\u0438\u0440\u0430\u0435\u043C \u0441\u043E\u0441\u0442\u0430\u0432\u044B \u043F\u043E \u043E\u0447\u0435\u0440\u0435\u0434\u0438 \u0438 \u043C\u043E\u0436\u0435\u043C \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u0432\u0430\u0448, \u043D\u043E \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u044F \u0435\u0441\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0443 \u043F\u043B\u0430\u0442\u043D\u044B\u0445 \u0442\u0430\u0440\u0438\u0444\u043E\u0432.":"Free submission does not guarantee a video appearance. We review squads in turn and may pick yours, but only paid plans come with a guarantee.","\u0427\u0435\u043C \u042D\u043A\u0441\u043F\u0440\u0435\u0441\u0441 \u043E\u0442\u043B\u0438\u0447\u0430\u0435\u0442\u0441\u044F \u043E\u0442 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u0430?":"How is Express different from Standard?","\u041E\u0431\u0430 \u0442\u0430\u0440\u0438\u0444\u0430 \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u0443\u044E\u0442 \u0432\u0438\u0434\u0435\u043E. \u042D\u043A\u0441\u043F\u0440\u0435\u0441\u0441 \u043E\u0431\u0440\u0430\u0431\u0430\u0442\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0432\u043D\u0435 \u043E\u0431\u044B\u0447\u043D\u043E\u0439 \u043E\u0447\u0435\u0440\u0435\u0434\u0438, \u0442\u043E \u0435\u0441\u0442\u044C \u0440\u0430\u043D\u044C\u0448\u0435 \u0432\u0441\u0435\u0445, \u0430 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442 \u0438\u0434\u0451\u0442 \u0432 \u043E\u0431\u0449\u0435\u0439 \u043E\u0447\u0435\u0440\u0435\u0434\u0438 \u043F\u043B\u0430\u0442\u043D\u044B\u0445 \u0437\u0430\u043A\u0430\u0437\u043E\u0432.":"Both plans guarantee a video. Express is processed outside the regular queue, i.e. before everyone else, while Standard goes into the shared queue of paid orders.","\u0413\u0434\u0435 \u043F\u043E\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043E\u043F\u0443\u0431\u043B\u0438\u043A\u043E\u0432\u0430\u043D\u043D\u043E\u0435 \u0432\u0438\u0434\u0435\u043E?":"Where can I watch the published video?","\u041E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0437\u0430\u043A\u0430\u0437 \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0417\u0430\u043A\u0430\u0437\u044B\xBB: \u043F\u043E\u0441\u043B\u0435 \u043F\u0443\u0431\u043B\u0438\u043A\u0430\u0446\u0438\u0438 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0421\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u0432\u0438\u0434\u0435\u043E\xBB. \u0412\u0438\u0434\u0435\u043E \u0432\u044B\u0445\u043E\u0434\u044F\u0442 \u043D\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 TikTok, \u043D\u043E \u0438 \u043D\u0430 YouTube \u0438 \u0434\u0440\u0443\u0433\u0438\u0445 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u0430\u0445. \u041B\u0443\u0447\u0448\u0438\u0435 \u0441\u043E\u0441\u0442\u0430\u0432\u044B \u0442\u0430\u043A\u0436\u0435 \u0441\u043E\u0431\u0440\u0430\u043D\u044B \u0432 \u0417\u0430\u043B\u0435 \u0441\u043B\u0430\u0432\u044B.":'Open the order in the Orders tab: once published, a "Watch video" button will appear. Videos are released not only on TikTok but also on YouTube and other platforms. The best squads are also collected in the Hall of Fame.',"\u041A\u0430\u043A \u043E\u043F\u043B\u0430\u0442\u0438\u0442\u044C \u0442\u0430\u0440\u0438\u0444?":"How do I pay for a plan?","\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0442\u0430\u0440\u0438\u0444 \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0412 \u0432\u0438\u0434\u0435\u043E\xBB, \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u0435 \u0441\u043E\u0441\u0442\u0430\u0432 \u0438 \u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0438\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438 \u043F\u043E \u043E\u043F\u043B\u0430\u0442\u0435. \u041F\u043E\u0441\u043B\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0430 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \xAB\u042F \u043E\u043F\u043B\u0430\u0442\u0438\u043B\xBB. \u041F\u043B\u0430\u0442\u0451\u0436 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u0435\u0442 \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440 \u0432\u0440\u0443\u0447\u043D\u0443\u044E.":`Choose a plan in the "Get featured" tab, upload your squad and follow the payment instructions. After the transfer, tap "I've paid". An administrator confirms the payment manually.`,"\u041A\u043E\u0433\u0434\u0430 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0434\u044F\u0442 \u043C\u043E\u0439 \u043F\u043B\u0430\u0442\u0451\u0436?":"When will my payment be confirmed?","\u0410\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u0442 \u043F\u043B\u0430\u0442\u0435\u0436\u0438 \u0432\u0440\u0443\u0447\u043D\u0443\u044E, \u043E\u0431\u044B\u0447\u043D\u043E \u044D\u0442\u043E \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438. \u041A\u0430\u043A \u0442\u043E\u043B\u044C\u043A\u043E \u043F\u043B\u0430\u0442\u0451\u0436 \u0431\u0443\u0434\u0435\u0442 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0451\u043D, \u043F\u0440\u0438\u0434\u0451\u0442 \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u0435, \u0430 \u0437\u0430\u043A\u0430\u0437 \u0432\u0441\u0442\u0430\u043D\u0435\u0442 \u0432 \u043E\u0447\u0435\u0440\u0435\u0434\u044C.":"An administrator checks payments manually; it usually takes a short while. As soon as the payment is confirmed you will get a notification and the order will join the queue.","\u041C\u043E\u0436\u043D\u043E \u043B\u0438 \u0443\u043B\u0443\u0447\u0448\u0438\u0442\u044C \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0439 \u0437\u0430\u043A\u0430\u0437?":"Can I upgrade a free order?","\u0414\u0430. \u041E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0439 \u0437\u0430\u043A\u0430\u0437 \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0417\u0430\u043A\u0430\u0437\u044B\xBB \u0438 \u0432\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \xAB\u0423\u043B\u0443\u0447\u0448\u0438\u0442\u044C \u0434\u043E \u043F\u043B\u0430\u0442\u043D\u043E\u0433\u043E\xBB. \u0412\u0430\u0448 \u0441\u043E\u0441\u0442\u0430\u0432 \u0441\u0440\u0430\u0437\u0443 \u0441\u0442\u0430\u043D\u0435\u0442 \u0437\u0430\u043A\u0430\u0437\u043E\u043C \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0433\u043E \u0442\u0430\u0440\u0438\u0444\u0430.":'Yes. Open the free order in the Orders tab and choose "Upgrade to paid". Your squad immediately becomes an order on the selected plan.'},uk:{"\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u0435 \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442 \u0441\u043E\u0441\u0442\u0430\u0432\u0430 FC Mobile.":"\u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0442\u0435 \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442 \u0441\u043A\u043B\u0430\u0434\u0443 FC Mobile.","\u0427\u0451\u0442\u043A\u0438\u0439 \u0441\u043D\u0438\u043C\u043E\u043A \u0432\u0441\u0435\u0433\u043E \u0441\u0442\u0430\u0440\u0442\u043E\u0432\u043E\u0433\u043E \u0441\u043E\u0441\u0442\u0430\u0432\u0430.":"\u0427\u0456\u0442\u043A\u0438\u0439 \u0437\u043D\u0456\u043C\u043E\u043A \u0443\u0441\u044C\u043E\u0433\u043E \u0441\u0442\u0430\u0440\u0442\u043E\u0432\u043E\u0433\u043E \u0441\u043A\u043B\u0430\u0434\u0443.","\u0423\u043A\u0430\u0436\u0438\u0442\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0438\u0433\u0440\u043E\u043A\u0430.":"\u0412\u043A\u0430\u0436\u0456\u0442\u044C \u0434\u0430\u043D\u0456 \u0433\u0440\u0430\u0432\u0446\u044F.","\u0422\u043E\u043B\u044C\u043A\u043E \u043D\u0438\u043A\u043D\u0435\u0439\u043C \u0438 UID, \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0438\u0447\u0435\u0433\u043E.":"\u041B\u0438\u0448\u0435 \u043D\u0456\u043A\u043D\u0435\u0439\u043C \u0456 UID, \u0431\u0456\u043B\u044C\u0448\u0435 \u043D\u0456\u0447\u043E\u0433\u043E.","\u041F\u043E\u043B\u0443\u0447\u0438\u0442\u0435 \u043E\u0446\u0435\u043D\u043A\u0443 \u0441\u043E\u0441\u0442\u0430\u0432\u0430.":"\u041E\u0442\u0440\u0438\u043C\u0430\u0439\u0442\u0435 \u043E\u0446\u0456\u043D\u043A\u0443 \u0441\u043A\u043B\u0430\u0434\u0443.","\u041C\u044B \u043E\u0446\u0435\u043D\u0438\u043C \u0435\u0433\u043E \u0438 \u0441\u043E\u043E\u0431\u0449\u0438\u043C \u043F\u0440\u044F\u043C\u043E \u0437\u0434\u0435\u0441\u044C, \u0432 Telegram.":"\u041C\u0438 \u043E\u0446\u0456\u043D\u0438\u043C\u043E \u0439\u043E\u0433\u043E \u0439 \u043F\u043E\u0432\u0456\u0434\u043E\u043C\u0438\u043C\u043E \u043F\u0440\u044F\u043C\u043E \u0442\u0443\u0442, \u0443 Telegram.","\u041E\u0446\u0435\u043D\u0438 \u0441\u0432\u043E\u0439":"\u041E\u0446\u0456\u043D\u0438 \u0441\u0432\u0456\u0439",\u04 u0412\u0441\u0435 \u0438\u0433\u0440\u043E\u043A\u0438 \u0438 \u0438\u0445 \u0440\u0435\u0439\u0442\u0438\u043D\u0433\u0438 \u0434\u043E\u043B\u0436\u043D\u044B \u0445\u043E\u0440\u043E\u0448\u043E \u0447\u0438\u0442\u0430\u0442\u044C\u0441\u044F, \u0431\u0435\u0437 \u043E\u0431\u0440\u0435\u0437\u0430\u043D\u043D\u044B\u0445 \u043A\u0440\u0430\u0451\u0432.":"\u0427\u0456\u0442\u043A\u0438\u0439 \u0437\u043D\u0456\u043C\u043E\u043A \u0443\u0441\u044C\u043E\u0433\u043E \u0441\u0442\u0430\u0440\u0442\u043E\u0432\u043E\u0433\u043E \u0441\u043A\u043B\u0430\u0434\u0443 \u0443 \u0444\u043E\u0440\u043C\u0430\u0442\u0456 JPG, PNG \u0430\u0431\u043E WEBP. \u0423\u0441\u0456 \u0433\u0440\u0430\u0432\u0446\u0456 \u0442\u0430 \u0457\u0445\u043D\u0456 \u0440\u0435\u0439\u0442\u0438\u043D\u0433\u0438 \u043C\u0430\u044E\u0442\u044C \u0434\u043E\u0431\u0440\u0435 \u0447\u0438\u0442\u0430\u0442\u0438\u0441\u044F, \u0431\u0435\u0437 \u043E\u0431\u0440\u0456\u0437\u0430\u043D\u0438\u0445 \u043A\u0440\u0430\u0457\u0432.","\u041F\u043E\u0447\u0435\u043C\u0443 \u043C\u043E\u0439 \u0437\u0430\u043A\u0430\u0437 \u043E\u0442\u043A\u043B\u043E\u043D\u0438\u043B\u0438?":"\u0427\u043E\u043C\u0443 \u043C\u043E\u0454 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0432\u0456\u0434\u0445\u0438\u043B\u0438\u043B\u0438?","\u041E\u0431\u044B\u0447\u043D\u043E \u043F\u0440\u0438\u0447\u0438\u043D\u0430 \u0432 \u043D\u0435\u0447\u0438\u0442\u0430\u0435\u043C\u043E\u043C \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442\u0435 \u0438\u043B\u0438 \u043D\u0435\u0432\u0435\u0440\u043D\u043E\u043C UID. \u041E\u0442\u043F\u0440\u0430\u0432\u044C\u0442\u0435 \u043D\u043E\u0432\u044B\u0439 \u0437\u0430\u043A\u0430\u0437 \u0441 \u0431\u043E\u043B\u0435\u0435 \u0447\u0451\u0442\u043A\u0438\u043C \u0441\u043D\u0438\u043C\u043A\u043E\u043C. \u0415\u0441\u043B\u0438 \u0441\u043E\u043C\u043D\u0435\u0432\u0430\u0435\u0442\u0435\u0441\u044C, \u043D\u0430\u043F\u0438\u0448\u0438\u0442\u0435 \u0432 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443.":"\u0417\u0430\u0437\u0432\u0438\u0447\u0430\u0439 \u043F\u0440\u0438\u0447\u0438\u043D\u0430 \u0432 \u043D\u0435\u0447\u0438\u0442\u0430\u0431\u0435\u043B\u044C\u043D\u043E\u043C\u0443 \u0441\u043A\u0440\u0438\u043D\u0448\u043E\u0442\u0456 \u0430\u0431\u043E \u043D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E\u043C\u0443 UID. \u041D\u0430\u0434\u0456\u0448\u043B\u0456\u0442\u044C \u043D\u043E\u0432\u0435 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u0437 \u0447\u0456\u0442\u043A\u0456\u0448\u0438\u043C \u0437\u043D\u0456\u043C\u043A\u043E\u043C. \u042F\u043A\u0449\u043E \u0441\u0443\u043C\u043D\u0456\u0432\u0430\u0454\u0442\u0435\u0441\u044F, \u043D\u0430\u043F\u0438\u0448\u0456\u0442\u044C \u0443 \u043F\u0456\u0434\u0442\u0440\u0438\u043C\u043A\u0443.","\u041F\u043E\u043F\u0430\u0434\u0443 \u043B\u0438 \u044F \u0432 \u0432\u0438\u0434\u0435\u043E \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u043E?":"\u0427\u0438 \u043F\u043E\u0442\u0440\u0430\u043F\u043B\u044E \u044F \u0443 \u0432\u0456\u0434\u0435\u043E \u0431\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u043E?","\u0411\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u0430\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u0430 \u043D\u0435 \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u0443\u0435\u0442 \u043F\u043E\u044F\u0432\u043B\u0435\u043D\u0438\u0435 \u0432 \u0432\u0438\u0434\u0435\u043E. \u041C\u044B \u0440\u0430\u0437\u0431\u0438\u0440\u0430\u0435\u043C \u0441\u043E\u0441\u0442\u0430\u0432\u044B \u043F\u043E \u043E\u0447\u0435\u0440\u0435\u0434\u0438 \u0438 \u043C\u043E\u0436\u0435\u043C \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u0432\u0430\u0448, \u043D\u043E \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u044F \u0435\u0441\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0443 \u043F\u043B\u0430\u0442\u043D\u044B\u0445 \u0442\u0430\u0440\u0438\u0444\u043E\u0432.":"\u0411\u0435\u0437\u043A\u043E\u0448\u0442\u043E\u0432\u043D\u0435 \u043D\u0430\u0434\u0441\u0438\u043B\u0430\u043D\u043D\u044F \u043D\u0435 \u0433\u0430\u0440\u0430\u043D\u0442\u0443\u0454 \u043F\u043E\u044F\u0432\u0443 \u0443 \u0432\u0456\u0434\u0435\u043E. \u041C\u0438 \u0440\u043E\u0437\u0431\u0438\u0440\u0430\u0454\u043C\u043E \u0441\u043A\u043B\u0430\u0434\u0438 \u043F\u043E \u0447\u0435\u0440\u0437\u0456 \u0439 \u043C\u043E\u0436\u0435\u043C\u043E \u043E\u0431\u0440\u0430\u0442\u0438 \u0432\u0430\u0448, \u0430\u043B\u0435 \u0433\u0430\u0440\u0430\u043D\u0442\u0456\u044F \u0454 \u043B\u0438\u0448\u0435 \u0432 \u043F\u043B\u0430\u0442\u043D\u0438\u0445 \u0442\u0430\u0440\u0438\u0444\u0456\u0432.","\u0427\u0435\u043C \u042D\u043A\u0441\u043F\u0440\u0435\u0441\u0441 \u043E\u0442\u043B\u0438\u0447\u0430\u0435\u0442\u0441\u044F \u043E\u0442 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u0430?":"\u0427\u0438\u043C \u0415\u043A\u0441\u043F\u0440\u0435\u0441 \u0432\u0456\u0434\u0440\u0456\u0437\u043D\u044F\u0454\u0442\u044C\u0441\u044F \u0432\u0456\u0434 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442\u0443?","\u041E\u0431\u0430 \u0442\u0430\u0440\u0438\u0444\u0430 \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0440\u0443\u044E\u0442 \u0432\u0438\u0434\u0435\u043E. \u042D\u043A\u0441\u043F\u0440\u0435\u0441\u0441 \u043E\u0431\u0440\u0430\u0431\u0430\u0442\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0432\u043D\u0435 \u043E\u0431\u044B\u0447\u043D\u043E\u0439 \u043E\u0447\u0435\u0440\u0435\u0434\u0438, \u0442\u043E \u0435\u0441\u0442\u044C \u0440\u0430\u043D\u044C\u0448\u0435 \u0432\u0441\u0435\u0445, \u0430 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442 \u0438\u0434\u0451\u0442 \u0432 \u043E\u0431\u0449\u0435\u0439 \u043E\u0447\u0435\u0440\u0435\u0434\u0438 \u043F\u043B\u0430\u0442\u043D\u044B\u0445 \u0437\u0430\u043A\u0430\u0437\u043E\u0432.":"\u041E\u0431\u0438\u0434\u0432\u0430 \u0442\u0430\u0440\u0438\u0444\u0438 \u0433\u0430\u0440\u0430\u043D\u0442\u0443\u044E\u0442\u044C \u0432\u0456\u0434\u0435\u043E. \u0415\u043A\u0441\u043F\u0440\u0435\u0441 \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0454\u0442\u044C\u0441\u044F \u043F\u043E\u0437\u0430 \u0437\u0432\u0438\u0447\u0430\u0439\u043D\u043E\u044E \u0447\u0435\u0440\u0433\u043E\u044E, \u0442\u043E\u0431\u0442\u043E \u0440\u0430\u043D\u0456\u0448\u0435 \u0437\u0430 \u0432\u0441\u0456\u0445, \u0430 \u0421\u0442\u0430\u043D\u0434\u0430\u0440\u0442 \u0456\u0434\u0435 \u0443 \u0441\u043F\u0456\u043B\u044C\u043D\u0456\u0439 \u0447\u0435\u0440\u0437\u0456 \u043F\u043B\u0430\u0442\u043D\u0438\u0445 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u044C.","\u0413\u0434\u0435 \u043F\u043E\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043E\u043F\u0443\u0431\u043B\u0438\u043A\u043E\u0432\u0430\u043D\u043D\u043E\u0435 \u0432\u0438\u0434\u0435\u043E?":"\u0414\u0435 \u043F\u043E\u0434\u0438\u0432\u0438\u0442\u0438\u0441\u044F \u043E\u043F\u0443\u0431\u043B\u0456\u043A\u043E\u0432\u0430\u043D\u0435 \u0432\u0456\u0434\u0435\u043E?","\u041E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0437\u0430\u043A\u0430\u0437 \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0417\u0430\u043A\u0430\u0437\u044B\xBB: \u043F\u043E\u0441\u043B\u0435 \u043F\u0443\u0431\u043B\u0438\u043A\u0430\u0446\u0438\u0438 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0421\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u0432\u0438\u0434\u0435\u043E\xBB. \u0412\u0438\u0434\u0435\u043E \u0432\u044B\u0445\u043E\u0434\u044F\u0442 \u043D\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 TikTok, \u043D\u043E \u0438 \u043D\u0430 YouTube \u0438 \u0434\u0440\u0443\u0433\u0438\u0445 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u0430\u0445. \u041B\u0443\u0447\u0448\u0438\u0435 \u0441\u043E\u0441\u0442\u0430\u0432\u044B \u0442\u0430\u043A\u0436\u0435 \u0441\u043E\u0431\u0440\u0430\u043D\u044B \u0432 \u0417\u0430\u043B\u0435 \u0441\u043B\u0430\u0432\u044B.":"\u0412\u0456\u0434\u043A\u0440\u0438\u0439\u0442\u0435 \u0437\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F \u043D\u0430 \u0432\u043A\u043B\u0430\u0434\u0446\u0456 \xAB\u0417\u0430\u043C\u043E\u0432\u043B\u0435\u043D\u043D\u044F\xBB: \u043F\u0456\u0441\u043B\u044F \u043F\u0443\u0431\u043B\u0456\u043A\u0430\u0446\u0456\u0457 \u0437\u2019\u044F\u0432\u0438\u0442\u044C\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0414\u0438\u0432\u0438\u0442\u0438\u0441\u044F \u0432\u0456\u0434\u0435\u043E\xBB. \u0412\u0456\u0434\u0435\u043E \u0432\u0438\u0445\u043E\u0434\u044F\u0442\u044C \u043D\u0435 \u043B\u0438\u0448\u0435 \u043D\u0430 TikTok, \u0430 \u0439 \u043D\u0430 YouTube \u0442\u0430 \u0456\u043D\u0448\u0438\u0445 \u043C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A\u0430\u0445. \u041D\u0430\u0439\u043A\u0440\u0430\u0449\u0456 \u0441\u043A\u043B\u0430\u0434\u0438 \u0442\u0430\u043A\u043E\u0436 \u0437\u0456\u0431\u0440\u0430\u043D\u043E \u0432 \u0417\u0430\u043B\u0456 \u0441\u043B\u0430\u0432\u0438.","\u041A\u0430\u043A \u043E\u043F\u043B\u0430\u0442\u0438\u0442\u044C \u0442\u0430\u0440\u0438\u0444?":"\u042F\u043A \u043E\u043F\u043B\u0430\u0442\u0438\u0442\u0438 \u0442\u0430\u0440\u0438\u0444?","\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0442\u0430\u0440\u0438\u0444 \u0432\u043E \u0432\u043A\u043B\u0430\u0434\u043A\u0435 \xAB\u0412 \u0432\u0438\u0434\u0435\u043E\xBB, \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u0435 \u0441\u043E\u0441\u0442\u0430\u0432 \u0438 \u0441\u043B\u0435\u0434\u0443\u0439\u0442\u0435 \u0438\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438 \u043F\u043E \u043E\u043F\u043B\u0430\u0442\u0435. \u041F\u043E\u0441\u043B\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0430 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \xAB\u042F \u043E\u043F\u043B\u0430\u0442\u0438\u043B\xBB. \u041F\u043B\u0430\u0442\u0451\u0436 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u0435\u0442 \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440 \u0432\u0440\u0443\u0447\u043

}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop2 {
  from {
    opacity: 0;
    transform: rotate(-70deg) scale(0.6);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes glow {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 6px 1px rgb(10 132 255 / 0.7), 0 0 0 0 rgb(10 132 255 / 0.5);
  }
  50% {
    transform: scale(1.25);
    box-shadow: 0 0 14px 4px rgb(10 132 255 / 0.85), 0 0 0 7px rgb(10 132 255 / 0);
  }
}
@keyframes ring {
  from {
    transform: scale(0.8);
    opacity: 0.9;
  }
  to {
    transform: scale(1.7);
    opacity: 0;
  }
}
@keyframes pop3 {
  from {
    transform: scale(0.4);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes draw {
  from {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  to {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
  }
}
@keyframes float {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  33% {
    transform: translate3d(28px, 18px, 0) scale(1.12);
  }
  66% {
    transform: translate3d(-20px, 30px, 0) scale(0.94);
  }
}
@keyframes letter {
  from {
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: none;
  }
}
@keyframes bar {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}
@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}
@keyframes scan {
  0%, 100% {
    top: 0;
  }
  50% {
    top: calc(100% - 3px);
  }
}
@keyframes shine {
  0%, 60% {
    transform: translateX(0) skewX(-20deg);
  }
  100% {
    transform: translateX(520%) skewX(-20deg);
  }
}
@keyframes btnglow {
  0%, 100% {
    box-shadow: 0 6px 18px rgb(10 132 255 / 0.35), inset 0 1px 0 rgb(255 255 255 / 0.28);
  }
  50% {
    box-shadow: 0 8px 30px rgb(10 132 255 / 0.6), inset 0 1px 0 rgb(255 255 255 / 0.28);
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes sheet {
  from {
    transform: translateY(100%);
  }
  to {
    transform: none;
  }
}
@keyframes toast {
  from {
    opacity: 0;
    transform: translateY(-12px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes shimmer {

    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
